name: APK Central RL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se a chave foi guardada nos segredos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Montar e assinar o APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RL_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/rl.keystore"
          export RL_KEYSTORE_FILE="$RUNNER_TEMP/rl.keystore"
          cd android && gradle assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/rl.keystore"

      - name: Conferir a assinatura (tem que ser a chave registrada no Google)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: c077e258bf5acb952178ea37d37160d0aac666cec14c90fc51d2562848a5f147" certs.txt \
            || { echo "::error::O APK não está assinado com a chave registrada"; exit 1; }

      - name: Publicar o APK no site (pasta download)
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/release/app-release.apk download/central-rl.apk
          echo "{\"versao\":\"1.0.${{ github.run_number }}\",\"data\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > download/versao.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add download/central-rl.apk download/versao.json
          git commit -m "APK Central RL 1.0.${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main && git push
