plugins {
    id 'com.android.application'
}

// A chave de assinatura NUNCA fica no repositório: vem dos segredos do GitHub
// (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD), decodificada só durante o build.
def ksFile = System.getenv("RL_KEYSTORE_FILE")
def ksPass = System.getenv("RL_KEYSTORE_PASSWORD")

android {
    namespace 'br.com.rlentregas'
    compileSdk 35

    defaultConfig {
        applicationId "rlentregas.com.br"   // nome registrado no Android Developer Console
        minSdk 24
        targetSdk 35
        versionCode (System.getenv("RL_VERSION_CODE") ?: "1") as int
        versionName "1.0." + (System.getenv("RL_VERSION_CODE") ?: "1")
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias "rlcentral"
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
