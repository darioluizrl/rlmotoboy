<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Rastreio — MegaEntregas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--or:#e8590c;--in:#0f9d58;--in-l:#e7f6ee;--warn:#b45309;--warn-l:#fef3c7;--bad:#c62828;--bad-l:#fdecea}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f3f4f6}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#16181d;color:#fff}
.top img{width:40px;height:40px;border-radius:8px}.top b{font-size:15px}.top small{display:block;color:#cbd5e1;font-size:12px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.st{border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:12px}
.st small{display:block;font-weight:500;margin-top:3px}
.st.ag{background:var(--warn-l);color:var(--warn)}.st.on{background:var(--in-l);color:var(--in)}.st.fim{background:#eef2ff;color:#3730a3}.st.err{background:var(--bad-l);color:var(--bad)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.go{background:var(--or);color:#fff}.btn.ok{background:var(--in);color:#fff}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;padding:12px}
.btn:disabled{opacity:.5}
#map{height:56vh;min-height:300px;border-radius:14px;border:1px solid var(--line)}
.lst div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.lst div:last-child{border:0}
.tg{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-right:6px;background:#e5e7eb}
.tg.retirada{background:var(--warn-l);color:var(--warn)}.tg.entrega{background:var(--in-l);color:var(--in)}.tg.ambos{background:#ffedd5;color:#c2410c}.tg.saida{background:#16181d;color:#fff}
.muted{color:var(--muted)}.sm{font-size:13px}a{color:var(--or)}
.ops{display:grid;grid-template-columns:1fr 340px;gap:12px;height:calc(100vh - 84px)}
.ops #map{height:100%;min-height:0}
.ops .side{overflow:auto;display:flex;flex-direction:column;gap:8px}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.it:hover{border-color:var(--or)}.it b{font-size:14px}
.cnt{display:flex;gap:6px;flex-wrap:wrap}.cnt span{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--line)}
.fl{display:flex;gap:6px}.fl button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:700;cursor:pointer}.fl button.on{background:#16181d;color:#fff}
body.embed .top{display:none}body.embed .ops{height:calc(100vh - 24px)}
@media(max-width:760px){.ops{grid-template-columns:1fr;height:auto}.ops #map{height:55vh}}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;border:3px solid #fff;box-shadow:0 1px 4px #0006}
</style></head><body>

<script>
const CFG={url:"https://glkltcsulanqsbzpwcdf.supabase.co",key:"sb_publishable_8h9FIs5NBKLtTajVgs4FxA_MIMPOmJ1"};
const sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false}});
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Tempo real: o celular do motoboy transmite a posição no canal da corrida (nome = token secreto de acompanhamento).
   Quem tem o link de acompanhamento escuta o canal e vê a moto andar na hora. O banco continua recebendo a posição
   a cada 5 s — se o tempo real falhar, a tela segue atualizando pelo banco. */
const canais={};
function canal(v,onPos){
  if(canais[v]) return canais[v];
  const nada={send(){}};
  try{
    const ch=sb.channel("rast-"+v,{config:{broadcast:{self:false,ack:false}}});
    if(onPos) ch.on("broadcast",{event:"pos"},m=>{ try{ onPos(m.payload||{}); }catch(e){} });
    ch.subscribe(st=>{ ch._ok = st==="SUBSCRIBED"; });
    canais[v]=ch; return ch;
  }catch(e){ return nada; }   /* sem tempo real: a tela continua atualizando pelo banco */
}
function soltarCanal(v){ const ch=canais[v]; if(ch){ try{ sb.removeChannel(ch); }catch(e){} delete canais[v]; } }
/* move o marcador suavemente até a nova posição */
function deslizar(m,lat,lon){
  if(!m) return; const a=m.getLatLng?m.getLatLng():null; if(!a||!window.requestAnimationFrame){ m.setLatLng([lat,lon]); return; }
  const t0=performance.now(), d=5000;   /* anda devagar entre um ponto e outro */ cancelAnimationFrame(m._anim);
  const passo=t=>{ const k=Math.min(1,(t-t0)/d), e=k;
    m.setLatLng([a.lat+(lat-a.lat)*e, a.lng+(lon-a.lng)*e]); if(k<1) m._anim=requestAnimationFrame(passo); };
  m._anim=requestAnimationFrame(passo);
}
function dados(){ try{ const h=location.hash.slice(1); if(!h) return {}; const b=h.replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return {}; } }
const hora=s=>s?new Date(s).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"";
function lista(r){
  const L=[]; if(r.origem&&r.origem.e) L.push(`<div><span class="tg saida">Saída</span>${esc(r.origem.e)}</div>`);
  (r.destinos||[]).forEach((d,i)=>L.push(`<div><span class="tg ${esc(d.t||"entrega")}">${i+1}. ${TIPO[d.t]||"Entrega"}</span>${esc(d.e)}</div>`));
  return `<div class="lst">${L.join("")}</div>`;
}
function navLink(r){
  const pts=(r.destinos||[]).filter(d=>d.la!=null); if(!pts.length) return "";
  const last=pts[pts.length-1], wp=pts.slice(0,-1).map(d=>d.la+","+d.lo).join("|");
  return `https://www.google.com/maps/dir/?api=1&destination=${last.la},${last.lo}${wp?"&waypoints="+encodeURIComponent(wp):""}&travelmode=two-wheeler`;
}

/* ================= MOTOBOY ================= */
let R=null, watch=null, lock=null, ultimoEnvio=0, ultimaPos=null, enviando=false, ultimoAoVivo=0;
async function motoboy(){
  $("#sub").textContent="Liberar rastreio (motoboy)";
  const {data,error}=await sb.rpc("rastreio_abrir",{p_moto:M,p_ver:V,p_dados:dados()});
  if(error){ app.innerHTML=`<div class="st err">Este link de rastreio não é válido.<small>${esc(error.message)}</small></div>`; return; }
  R=data; telaMoto();
}
function telaMoto(msg){
  const on=watch!==null, fim=R.status==="finalizado";
  const st = fim ? `<div class="st fim">✓ Corrida finalizada${R.finalizado_em?" às "+hora(R.finalizado_em):""}<small>O rastreio foi encerrado. Obrigado!</small></div>`
    : on ? `<div class="st on">● Rastreio ATIVO<small>Mantenha esta tela aberta e o celular desbloqueado. ${ultimaPos?"Última posição enviada às "+hora(ultimaPos):"Buscando o GPS…"}</small></div>`
    : `<div class="st ag">Rastreio desligado<small>Toque em “Liberar rastreio” quando sair para a corrida.</small></div>`;
  const nav=navLink(R);
  app.innerHTML=`${st}
    <div class="card"><b>${esc(R.titulo||"Corrida")}</b>${R.agendado?`<div class="sm" style="margin-top:4px">📅 ${esc(R.agendado)}</div>`:""}${R.km?`<div class="muted sm">${esc(R.km)} km</div>`:""}<div style="margin-top:8px">${lista(R)}</div>
      ${nav?`<a class="btn sec" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${nav}">🧭 Abrir navegação no Google Maps</a>`:""}</div>
    ${fim?"":on?`<button class="btn ok" onclick="finalizar()">✓ Finalizar entrega</button><button class="btn sec" onclick="parar()">Pausar rastreio</button>`
      :`<button class="btn go" onclick="iniciar()">📍 Liberar rastreio</button><p class="muted sm">Ao liberar, sua localização é enviada para a RL Motoboy e para quem tem o link de acompanhamento desta corrida, só enquanto o rastreio estiver ligado. Ele é encerrado quando você finaliza a entrega.</p>`}
    ${msg?`<div class="st err" style="margin-top:10px">${esc(msg)}</div>`:""}`;
}
async function iniciar(){
  if(!("geolocation" in navigator)){ telaMoto("Este celular não permite localização pelo navegador."); return; }
  try{ if("wakeLock" in navigator) lock=await navigator.wakeLock.request("screen"); }catch(e){}
  watch=navigator.geolocation.watchPosition(enviar, e=>{ const m={1:"Você não permitiu a localização. Toque no cadeado ao lado do endereço e permita.",2:"GPS indisponível agora. Verifique se a localização do celular está ligada.",3:"O GPS demorou para responder."}[e.code]||e.message; telaMoto(m); }, {enableHighAccuracy:true, maximumAge:2000, timeout:30000});
  telaMoto();
}
async function enviar(p){
  const agora=Date.now();
  if(V && agora-ultimoAoVivo>=6000){   /* ao vivo: 1 posição a cada 6 s (economiza a cota de mensagens) */ ultimoAoVivo=agora;
    try{ canal(V).send({type:"broadcast",event:"pos",payload:{lat:p.coords.latitude,lon:p.coords.longitude,prec:Math.round(p.coords.accuracy||0),t:agora}}); }catch(e){} }
  if(enviando || agora-ultimoEnvio<12000) return;   /* banco: a cada 12 s */
  enviando=true; ultimoEnvio=agora;
  try{
    const {data,error}=await sb.rpc("rastreio_posicao",{p_moto:M,p_lat:p.coords.latitude,p_lon:p.coords.longitude,p_prec:Math.round(p.coords.accuracy||0)});
    if(!error){ ultimaPos=new Date().toISOString(); if(data==="finalizado"||data==="expirado"){ parar(); R.status="finalizado"; } }
  }catch(e){} finally{ enviando=false; }
  telaMoto();
}
function parar(){ if(watch!==null) navigator.geolocation.clearWatch(watch); watch=null; try{ lock&&lock.release(); }catch(e){} lock=null; telaMoto(); }
async function finalizar(){
  if(!confirmar) { confirmar=true; const b=document.querySelector(".btn.ok"); if(b){ b.textContent="Toque de novo para confirmar"; } setTimeout(()=>{confirmar=false; if(watch!==null) telaMoto();},4000); return; }
  parar(); const {error}=await sb.rpc("rastreio_finalizar",{p_moto:M});
  try{ if(V) canal(V).send({type:"broadcast",event:"pos",payload:{fim:true,t:Date.now()}}); }catch(e){}
  if(!error){ R.status="finalizado"; R.finalizado_em=new Date().toISOString(); } telaMoto(error?error.message:"");
}
let confirmar=false;
document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState==="visible" && watch!==null){ try{ if("wakeLock" in navigator) lock=await navigator.wakeLock.request("screen"); }catch(e){} } });

/* ================= ACOMPANHAMENTO (RL e cliente) ================= */
let map=null, mk=null, fixos=false;
function pin(cor,txt){ return L.divIcon({className:"",html:`<div class="pin" style="background:${cor}">${txt}</div>`,iconSize:[30,30],iconAnchor:[15,15]}); }
async function acompanhar(){
  $("#sub").textContent="Acompanhamento da corrida";
  app.innerHTML=`<div id="stBox"></div><div id="map"></div><div class="card" id="info" style="margin-top:12px"></div>`;
  map=L.map("map",{zoomControl:true}).setView([-23.6,-46.57],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  await atualizar(); setInterval(atualizar,10000);
  canal(V,p=>{ if(p.fim){ atualizar(); return; } if(p.lat==null) return;
    VIVO.t=Date.now();
    if(!mk) mk=L.marker([p.lat,p.lon],{icon:pin("#e8590c","🏍"),zIndexOffset:1000}).addTo(map).bindPopup("Motoboy"); else deslizar(mk,p.lat,p.lon);
    if(seguir) map.panTo([p.lat,p.lon],{animate:true});
    vivoTxt(); });
  setInterval(vivoTxt,1000);
  map.on("dragstart",()=>{ seguir=false; });
}
let VIVO={t:0}, seguir=false, ULT=null;
function vivoTxt(){
  const b=$("#stBox"); if(!b||!ULT||ULT.status==="finalizado"||ULT.status==="aguardando") return;
  if(VIVO.t && Date.now()-VIVO.t<30000){ const seg=Math.round((Date.now()-VIVO.t)/1000);
    b.innerHTML=`<div class="st on">🔴 AO VIVO · Motoboy a caminho<small>Posição em tempo real · atualizada há ${seg} s · <a href="#" onclick="seguir=!seguir;if(seguir&&mk)map.panTo(mk.getLatLng());vivoTxt();return false">${seguir?"parar de seguir":"seguir a moto"}</a></small></div>`; }
}
async function atualizar(){
  const {data:r,error}=await sb.rpc("rastreio_ver",{p_ver:V});
  if(error){ $("#stBox").innerHTML=`<div class="st err">Não foi possível carregar.<small>${esc(error.message)}</small></div>`; return; }
  if(!r){ $("#stBox").innerHTML=`<div class="st ag">Aguardando o motoboy abrir o link de rastreio<small>Esta página atualiza sozinha.</small></div>`; return; }
  ULT=r;
  const seg=r.atualizado_em?Math.round((new Date(r.agora)-new Date(r.atualizado_em))/1000):null;
  const antigo=seg!=null&&seg>120;
  $("#stBox").innerHTML = r.status==="finalizado" ? `<div class="st fim">✓ Corrida finalizada${r.finalizado_em?" às "+hora(r.finalizado_em):""}</div>`
    : r.status==="aguardando" ? `<div class="st ag">Aguardando o motoboy liberar o rastreio<small>Esta página atualiza sozinha.</small></div>`
    : `<div class="st ${antigo?"ag":"on"}">${antigo?"Sem sinal do motoboy há "+Math.round(seg/60)+" min":"● Motoboy a caminho"}<small>Última posição às ${hora(r.atualizado_em)}${seg!=null&&!antigo?" (há "+seg+" s)":""}</small></div>`;
  $("#info").innerHTML=`<b>${esc(r.titulo||"Corrida")}</b>${r.agendado?`<div class="sm" style="margin-top:4px">📅 ${esc(r.agendado)}</div>`:""}<div id="prev"></div><div style="margin-top:8px">${lista(r)}</div>`;
  previsao();
  const b=[];
  if(!fixos){ fixos=true;
    if(r.origem&&r.origem.la!=null){ L.marker([r.origem.la,r.origem.lo],{icon:pin("#16181d","S")}).addTo(map).bindPopup("Saída: "+esc(r.origem.e)); }
    (r.destinos||[]).forEach((d,i)=>{ if(d.la!=null) L.marker([d.la,d.lo],{icon:pin(d.t==="retirada"?"#b45309":d.t==="ambos"?"#c2410c":"#0f9d58",i+1)}).addTo(map).bindPopup(esc((TIPO[d.t]||"Entrega")+": "+d.e)); });
  }
  if(r.origem&&r.origem.la!=null) b.push([r.origem.la,r.origem.lo]);
  (r.destinos||[]).forEach(d=>{ if(d.la!=null) b.push([d.la,d.lo]); });
  if(r.lat!=null && r.status!=="aguardando"){
    if(!mk) mk=L.marker([r.lat,r.lon],{icon:pin("#e8590c","🏍"),zIndexOffset:1000}).addTo(map).bindPopup("Motoboy"); else if(!(VIVO.t&&Date.now()-VIVO.t<15000)) mk.setLatLng([r.lat,r.lon]);
    b.push([r.lat,r.lon]);
  }
  if(b.length && !atualizar._fit){ atualizar._fit=1; map.fitBounds(b,{padding:[30,30],maxZoom:16}); }
  if(r.status==="finalizado") soltarCanal(V); else vivoTxt();
}

/* previsão de retirada e entrega (serviços MegaEntregas) */
let PREV=null, prevT=0;
async function previsao(){
  const el=$("#prev"); if(!el) return;
  if(Date.now()-prevT>20000||!PREV){ prevT=Date.now(); try{ const {data,error}=await sb.rpc("servico_previsao_publica",{p_ver:V}); PREV=error?null:data; }catch(e){ PREV=null; } }
  if(!PREV){ el.innerHTML=""; return; }
  const h=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const em=t=>{ const m=Math.round((new Date(t)-Date.now())/60000); return m<=1?"chegando":"em ~"+m+" min"; };
  const lin=(ic,rot,x)=>`<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)"><span>${ic}</span><div style="flex:1"><b>${rot}</b><div class="sm muted">${esc(String(x.e||"").split(",")[0])}</div></div>
    <div style="text-align:right">${x.real?`<b style="color:#0f9d58">✓ ${h(x.real)}</b><div class="sm muted">feita</div>`:x.prev?`<b>${h(x.prev)}</b><div class="sm muted">${em(x.prev)}</div>`:`<span class="sm muted">—</span>`}</div></div>`;
  el.innerHTML=`<div style="margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff">
    <div class="sm" style="font-weight:800;margin-bottom:2px">🕒 Previsões</div>
    ${lin("🏁","Retirada",PREV.retirada||{})}${(PREV.entregas||[]).map((e,i)=>lin("📦",(PREV.entregas.length>1?"Entrega "+(i+1):"Entrega"),e)).join("")}
    <div class="sm muted" style="margin-top:4px">${PREV.gps?"Calculada com a posição do motoboy agora.":"Estimativa pelo trajeto."} Pode mudar com o trânsito.</div></div>`;
}
/* ================= OPERAÇÃO (todos os rastreios) ================= */
let OPS=[], FIL="ativos", mks={}, dmk=[], opsFit=false;
function opsLista(){ try{ const h=location.hash.slice(1); const b=h.replace(/-/g,"+").replace(/_/g,"/"); const a=JSON.parse(decodeURIComponent(escape(atob(b)))); return Array.isArray(a)?a.filter(x=>/^[a-f0-9]{32}$/.test(x.v)).slice(0,150):[]; }catch(e){ return []; } }
async function operacao(){
  if(q.get("embed")) document.body.classList.add("embed");
  $("#sub").textContent="Operação — todos os rastreios";
  OPS=opsLista();
  app.style.maxWidth="none";
  app.innerHTML=`<div class="ops"><div id="map"></div><div class="side">
    <div class="cnt" id="cnt"></div>
    <div class="fl"><button id="fA" class="on" onclick="FIL='ativos';opsDesenhar()">Em andamento</button><button id="fT" onclick="FIL='todos';opsDesenhar()">Todos</button></div>
    <div id="lst"></div><p class="muted sm" id="upd"></p></div></div>`;
  map=L.map("map").setView([-23.6,-46.57],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  if(!OPS.length){ $("#lst").innerHTML=`<div class="st ag">Nenhum rastreio gerado ainda<small>Gere os links de rastreio nas O.S. do sistema.</small></div>`; return; }
  await opsAtualizar(); setInterval(opsAtualizar,10000); setInterval(opsVivoTxt,1000);
}
const OVIVO={};   /* v -> hora da última posição ao vivo */
function opsOuvir(){
  /* escuta ao vivo só as corridas que não terminaram (até 90 canais numa conexão) */
  const ativos=OPS.filter(x=>{ const r=OPSD[x.v]; return !r||r.status!=="finalizado"; }).slice(0,90).map(x=>x.v);
  Object.keys(canais).forEach(v=>{ if(!ativos.includes(v)) soltarCanal(v); });
  ativos.forEach(v=>canal(v,p=>{
    if(p.fim){ opsAtualizar(); return; } if(p.lat==null) return;
    OVIVO[v]=Date.now(); const r=OPSD[v]; if(r){ r.lat=p.lat; r.lon=p.lon; if(r.status==="aguardando") r.status="em_rota"; r.atualizado_em=new Date().toISOString(); r.agora=r.atualizado_em; }
    const x=OPS.find(o=>o.v===v), i=OPS.indexOf(x)+1;
    if(mks[v]) deslizar(mks[v],p.lat,p.lon);
    else if(r) opsDesenhar();
    opsVivoTxt();
  }));
}
function opsVivoTxt(){
  const n=Object.values(OVIVO).filter(t=>Date.now()-t<30000).length;
  const u=$("#upd"); if(u) u.innerHTML=(n?`<b style="color:#c62828">🔴 AO VIVO</b> · ${n} moto(s) transmitindo agora · `:"")+"banco conferido às "+(opsAtualizar._h||"—");
  document.querySelectorAll("[data-vivo]").forEach(e=>{ const t=OVIVO[e.dataset.vivo]; if(t&&Date.now()-t<30000) e.textContent="🔴 Ao vivo · há "+Math.round((Date.now()-t)/1000)+" s"; });
}
let OPSD={};
async function opsAtualizar(){
  const {data,error}=await sb.rpc("rastreio_varios",{p_vers:OPS.map(x=>x.v)});
  if(error){ $("#upd").textContent="Erro ao atualizar: "+error.message; return; }
  OPSD={}; (data||[]).forEach(r=>OPSD[r.v]=r);
  opsAtualizar._h=new Date().toLocaleTimeString("pt-BR");
  opsDesenhar(); opsOuvir(); opsVivoTxt();
}
function opsSit(r){
  if(!r) return ["ag","Aguardando o motoboy abrir o link"];
  if(r.status==="finalizado") return ["fim","Finalizada"+(r.finalizado_em?" às "+hora(r.finalizado_em):"")];
  if(r.status==="aguardando") return ["ag","Aguardando liberar o rastreio"];
  const seg=r.atualizado_em?Math.round((new Date(r.agora)-new Date(r.atualizado_em))/1000):null;
  return seg!=null&&seg>120 ? ["err","Sem sinal há "+Math.round(seg/60)+" min"] : ["on","Em rota · "+(seg!=null?"há "+seg+" s":"")];
}
function opsDesenhar(){
  $("#fA").classList.toggle("on",FIL==="ativos"); $("#fT").classList.toggle("on",FIL==="todos");
  const n={on:0,ag:0,err:0,fim:0}; OPS.forEach(x=>n[opsSit(OPSD[x.v])[0]]++);
  $("#cnt").innerHTML=`<span style="color:#0f9d58">● ${n.on} em rota</span><span style="color:#b45309">${n.ag} aguardando</span>${n.err?`<span style="color:#c62828">${n.err} sem sinal</span>`:""}<span style="color:#3730a3">${n.fim} finalizadas</span>`;
  const vis=OPS.map((x,i)=>({...x,i:i+1,r:OPSD[x.v]})).filter(x=>FIL==="todos"||!x.r||x.r.status!=="finalizado");
  $("#lst").innerHTML=vis.length?vis.map(x=>{ const [c,t]=opsSit(x.r); return `<div class="it" onclick="opsFoco('${x.v}')">
      <b>${x.i}. ${esc((x.r&&x.r.titulo)||x.t||"Corrida")}</b>${x.c?`<div class="muted sm">${esc(x.c)}</div>`:""}
      <div class="st ${c}" style="margin:6px 0 0;padding:6px 10px;font-size:13px"${c==="on"?` data-vivo="${x.v}"`:""}>${esc(t)}</div>
      ${x.r&&x.r.agendado?`<div class="sm" style="margin-top:4px">📅 ${esc(x.r.agendado)}</div>`:""}
      ${x.r&&x.r.destinos&&x.r.destinos.length?`<div class="muted sm" style="margin-top:4px">${esc(x.r.destinos.map(d=>d.e.split(",")[0]).join(" → "))}</div>`:""}
      <a class="sm" href="?v=${x.v}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Abrir acompanhamento ↗</a></div>`; }).join("")
    : `<div class="st fim">Nenhuma corrida em andamento agora.</div>`;
  const b=[];
  Object.keys(mks).forEach(v=>{ if(!vis.some(x=>x.v===v&&x.r&&x.r.lat!=null&&x.r.status!=="aguardando")){ map.removeLayer(mks[v]); delete mks[v]; } });
  dmk.forEach(m=>map.removeLayer(m)); dmk=[];
  vis.forEach(x=>{ const r=x.r; if(!r) return;
    if(r.lat!=null && r.status!=="aguardando"){
      const cor={on:"#e8590c",err:"#c62828",fim:"#3730a3"}[opsSit(r)[0]]||"#e8590c";
      const ic=pin(cor,x.i);
      if(!mks[x.v]) mks[x.v]=L.marker([r.lat,r.lon],{icon:ic,zIndexOffset:1000}).addTo(map).bindPopup(`<b>${esc(r.titulo||x.t)}</b><br>${esc(opsSit(r)[1])}`);
      else { if(!(OVIVO[x.v]&&Date.now()-OVIVO[x.v]<15000)) mks[x.v].setLatLng([r.lat,r.lon]); mks[x.v].setIcon&&mks[x.v].setIcon(ic); }
      b.push([r.lat,r.lon]);
    }
    if(r.status!=="finalizado") (r.destinos||[]).forEach((d,j)=>{ if(d.la!=null){ dmk.push(L.circleMarker([d.la,d.lo],{radius:6,color:"#fff",weight:2,fillColor:d.t==="retirada"?"#b45309":"#0f9d58",fillOpacity:1}).addTo(map).bindPopup(`${esc(x.i+". "+(r.titulo||""))}<br>${esc((TIPO[d.t]||"Entrega")+": "+d.e)}`)); b.push([d.la,d.lo]); } });
  });
  if(b.length && !opsFit){ opsFit=true; map.fitBounds(b,{padding:[30,30],maxZoom:15}); }
}
function opsFoco(v){ const m=mks[v]; if(m){ map.setView(m.getLatLng(),15); m.openPopup(); } else { const r=OPSD[v]; const d=r&&(r.destinos||[]).find(d=>d.la!=null); if(d) map.setView([d.la,d.lo],14); } }

if(q.get("ops")) operacao();
else if(M && V && /^[a-f0-9]{32}$/.test(M) && /^[a-f0-9]{32}$/.test(V)) motoboy();
else if(V && /^[a-f0-9]{32}$/.test(V)) acompanhar();
else app.innerHTML=`<div class="st err">Link de rastreio inválido.</div>`;
</script></body></html>
